<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>senior-p3 pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · senior-p3</p>
    <h1>Phone photos to limb volume and girth</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-diagram-title pipeline-diagram-desc">
        <title id="pipeline-diagram-title">senior-p3 pipeline: photos to limb volume and girth</title>
        <desc id="pipeline-diagram-desc">Senior's stages 0 to 4 turn phone photos into an open limb mesh; after the user reviews the cutting planes in the web app, leg-scan-measure's stages 5 to 7 cut the limb, close it with pymeshfix, and measure volume and circumference, with a re-cut loop back to review.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ===== Zones ===== -->
        <rect x="56" y="64" width="1168" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="72" y="88" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SENIOR · STAGES 0–4 · PHOTOS → OPEN MESH</text>

        <rect x="288" y="232" width="712" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="304" y="256" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEG-SCAN-MEASURE · STAGES 5–7 · CUT → CLOSE → MEASURE</text>

        <!-- ===== Arrows (before nodes) ===== -->
        <!-- Row 1 hand-offs -->
        <line x1="272" y1="144" x2="311" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="504" y1="144" x2="543" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="736" y1="144" x2="775" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="968" y1="144" x2="1007" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- S4 → Review: down, left along corridor, down -->
        <path d="M1104,176 V212 Q1104,220 1096,220 H184 Q176,220 176,228 V279" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="186" y="242" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="251" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNCUT MESH</text>

        <!-- Review → S5 -->
        <line x1="272" y1="312" x2="311" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="274" y="292" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLANES</text>

        <!-- S5 → S6 → S7 (headline path) -->
        <line x1="504" y1="312" x2="543" y2="312" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="736" y1="312" x2="775" y2="312" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Re-cut loop: S7 → Review (dashed) -->
        <path d="M872,344 V392 Q872,400 864,400 H184 Q176,400 176,392 V345" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="488" y="408" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="417" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-CUT 5–7</text>

        <!-- Result leader -->
        <line x1="968" y1="312" x2="1016" y2="312" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="2,3"/>

        <!-- ===== Row 1 nodes: senior ===== -->
        <g>
          <rect x="80" y="112" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="112" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="88" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="102" y="127" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S0</text>
          <text x="176" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Framing gate</text>
          <text x="176" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frame_NN.png · framing.json</text>
        </g>
        <g>
          <rect x="312" y="112" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="312" y="112" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="320" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="334" y="127" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S1</text>
          <text x="408" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">VGGT inference</text>
          <text x="408" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">predictions.npz</text>
        </g>
        <g>
          <rect x="544" y="112" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="544" y="112" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="552" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="566" y="127" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S2</text>
          <text x="640" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Point cloud</text>
          <text x="640" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">points.ply</text>
        </g>
        <g>
          <rect x="776" y="112" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="776" y="112" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="784" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="798" y="127" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
          <text x="872" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Segment + find bands</text>
          <text x="872" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">leg.ply · box.ply · planes</text>
        </g>
        <g>
          <rect x="1008" y="112" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="1008" y="112" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="1016" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="1030" y="127" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S4</text>
          <text x="1104" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Poisson reconstruct</text>
          <text x="1104" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">leg_recon.ply (open)</text>
        </g>

        <!-- ===== Review (web, user input) ===== -->
        <g>
          <rect x="80" y="280" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="280" width="192" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <rect x="88" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.55)" stroke-width="0.8"/>
          <text x="102" y="295" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
          <text x="176" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Review planes</text>
          <text x="176" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drag · live girth</text>
        </g>

        <!-- ===== Row 2 nodes: leg-scan-measure ===== -->
        <g>
          <rect x="312" y="280" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="312" y="280" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="320" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="334" y="295" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S5</text>
          <text x="408" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Exact plane cut</text>
          <text x="408" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">leg_cut_open.ply</text>
        </g>
        <g>
          <rect x="544" y="280" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="544" y="280" width="192" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="552" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.55)" stroke-width="0.8"/>
          <text x="566" y="295" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S6</text>
          <text x="640" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Fill to watertight</text>
          <text x="640" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pymeshfix → leg_cut.ply</text>
        </g>
        <g>
          <rect x="776" y="280" width="192" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="776" y="280" width="192" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="784" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.55)" stroke-width="0.8"/>
          <text x="798" y="295" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S7</text>
          <text x="872" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Measure</text>
          <text x="872" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">volume · girth at both cuts</text>
        </g>

        <!-- ===== Result callout ===== -->
        <text x="1024" y="300" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Scaled by the 10 cm cube.</text>
        <text x="1024" y="318" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Mean error ≈2% vs a 3D scanner</text>
        <text x="1024" y="336" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">across 10 legs.</text>

        <!-- ===== Legend ===== -->
        <line x1="30" y1="448" x2="1250" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="104" y="462" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="132" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">pipeline stage</text>

        <rect x="248" y="462" width="20" height="14" rx="3" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="276" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">user step in web app</text>

        <rect x="432" y="462" width="20" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="460" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">closed solid + measurement</text>

        <line x1="648" y1="469" x2="676" y2="469" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="688" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hand-off</text>

        <line x1="768" y1="469" x2="796" y2="469" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="808" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">re-cut: only stages 5–7 re-run</text>

        <rect x="1024" y="462" width="20" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="1052" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">source project</text>
      </svg>
    </div>
  </div>
</body>
</html>
